name: Offline validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate published JSONL logs
        run: python scripts/validate_logs.py
      - name: Run offline smoke tests
        run: python -m unittest -v tests.test_validate_logs
